info:
  version: '2.3.2026'
  id: seed-gen-blocks
  title: Seed Generation
  description: Calls cc-seed-generator-plugin to generate blocks configuration file
  jobControlOptions:
    - sync-execute
  outputTransmission:

host:
  type: docker
  image: seed-generator-plugin:sepex

command:

config:
  maxResources:
    cpus: 0.1
    memory: 256
  volumes:
    - ./data:/data

inputs:
  - id: payload_key_s3
    title: payload
    description: NOT IMPLEMENTED - user provided payload file (s3 key)
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: attributes
    title: attributes
    description: user provided attributes
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: stores
    title: stores
    description: user provided stores
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: actions
    title: actions
    description: user provided actions
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: inputs
    title: inputs
    description: user provided inputs
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: outputs
    title: outputs
    description: user provided outputs
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100


outputs:
  - id: blocks_json
    title: blocks.json
    description: generated blocks configuration file
    output:
      transmissionMode:
      - reference
      format: application/json
      href: /mnt/blocks.json