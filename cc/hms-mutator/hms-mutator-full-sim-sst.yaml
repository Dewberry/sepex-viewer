info:
  version: '2.3.2026'
  id: hms-mutator-full-sim-sst
  title: HMS Mutator Full Sim SST
  description: Calls cc-hms-mutator-full-sim-sst
  jobControlOptions:
    - sync-execute
  outputTransmission:

host:
  type: docker
  image: hms-mutator-full-sim-sst:sepex

command:

config:
  maxResources:
    cpus: 0.1
    memory: 256
  volumes:
    - /mnt/sepex:/mnt
    - /mnt/sepex-data:/data

inputs:
  - id: payload_key_s3
    title: payload
    description: NOT IMPLEMENTED - user provided payload file (s3 key)
    input:
      literalDataDomain:
        dataType: value
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 1

  - id: attributes
    title: attributes
    description: user provided attributes
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: stores
    title: stores
    description: user provided stores
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: actions
    title: actions
    description: user provided actions
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: inputs
    title: inputs
    description: user provided inputs
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100

  - id: outputs
    title: outputs
    description: user provided outputs
    input:
      literalDataDomain:
        dataType: list
        valueDefinition:
          anyValue: true
    minOccurs: 0
    maxOccurs: 100


